        <script>
            const includeHTML = (file, elementId) => {
                return fetch(file)
                    .then(response => {
                        if (!response.ok) {
                            throw new Error('File tidak ditemukan: ' + file);
                        }
                        return response.text();
                    })
                    .then(data => {
                        document.getElementById(elementId).innerHTML = data;
                    });
            };

            document.addEventListener("DOMContentLoaded", function() {
                const components = [
                    includeHTML('tentang.html', 'about-container'),
                    includeHTML('skill.html', 'skill-container'),
                    includeHTML('pendidikan.html', 'education-container'),
                    includeHTML('pengalaman.html', 'experience-container'),
                    includeHTML('layanan.html', 'service-container'),
                    includeHTML('portofolio.html', 'portfolio-container'),
                    includeHTML('kontak.html', 'contact-container')
                ];

                Promise.all(components)
                    .then(() => {
                        console.log('Semua komponen HTML berhasil dimuat.');
                        
                        $('.skill-slider').slick({
                            autoplay: true,
                            autoplaySpeed: 5000,
                            dots: false,
                            arrows: true,
                            slidesToShow: 4,
                            slidesToScroll: 1,
                            responsive: [
                                { breakpoint: 992, settings: { slidesToShow: 3 } },
                                { breakpoint: 768, settings: { slidesToShow: 2 } },
                                { breakpoint: 576, settings: { slidesToShow: 1 } }
                            ]
                        });

                        console.log('Carousel Keahlian berhasil diinisialisasi.');
                    })
                    .catch(error => {
                        console.error('Gagal memuat salah satu komponen:', error);
                    });
            });
        </script>
